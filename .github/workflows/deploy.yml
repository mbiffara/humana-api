name: Deploy to Amazon ECS

# Continuous deployment: every push to `main` builds the Docker image,
# pushes it to ECR, runs database migrations, and rolls out a new
# revision on ECS Fargate.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: humana/humana-api
  ECS_CLUSTER: humana-api-cluster
  ECS_SERVICE: humana-api-service
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: humana-api

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # Register the new task definition so the migration task uses the
      # latest image (with the newest code + migration files).
      - name: Register task definition for migration
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.task-def.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      # Discover the service's network configuration so the migration
      # task runs in the same VPC / subnets / security groups.
      # Write to a temp file to avoid multi-line JSON / quoting issues
      # with GITHUB_OUTPUT.
      - name: Get network configuration from ECS service
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json > /tmp/net-config.json
          echo "Network config:"
          cat /tmp/net-config.json

      # Run database migrations as a one-off Fargate task BEFORE the
      # rolling deploy, so the new schema is ready when new containers
      # start receiving traffic.
      - name: Run database migrations
        id: migrate
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "${{ steps.register-task-def.outputs.task_def_arn }}" \
            --launch-type FARGATE \
            --network-configuration file:///tmp/net-config.json \
            --overrides '{"containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["./bin/rails","db:prepare"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "Migration task: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for migration to complete
        run: |
          echo "Waiting for migration task to finish..."
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.migrate.outputs.task_arn }}"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.migrate.outputs.task_arn }}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration failed with exit code $EXIT_CODE"
            echo "Fetching migration logs..."
            TASK_ID=$(echo "${{ steps.migrate.outputs.task_arn }}" | awk -F'/' '{print $NF}')
            aws logs get-log-events \
              --log-group-name "/ecs/humana-api" \
              --log-stream-name "ecs/$CONTAINER_NAME/$TASK_ID" \
              --query 'events[*].message' \
              --output text 2>/dev/null || true
            exit 1
          fi

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
